<!doctype html>
<!--
  ui-stack-3d: illustrative product windows fanning out in soft 3D. Glossy
  white cards with real thickness, an --accent title bar, skeleton content,
  soft layered shadows and a blurred back layer (depth of field). The front
  window's inner card lifts toward the camera on the hero beat, and the
  whole stack drifts under a slow camera move. Pure CSS 3D: text stays crisp.
  Params: --us-x / --us-y (stack centre), --us-scale; FAN_AT, LIFT_AT
  (seconds). Swap skeleton blocks for real labels or an <img> screenshot.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="ui-stack-3d-root"
      data-composition-id="ui-stack-3d"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="ui-stack-3d"] {
          --us-x: 960px;
          --us-y: 660px;
          --us-scale: 0.86;
          --us-r: var(--radius, 22px);
          --us-accent: var(--accent, #2f5bff);
          --us-ink: var(--ink, #3a4150);
          position: absolute;
          inset: 0;
          perspective: 2200px;
          perspective-origin: 50% 40%;
        }
        [data-composition-id="ui-stack-3d"] .us-stage {
          position: absolute;
          left: var(--us-x);
          top: var(--us-y);
          width: 0;
          height: 0;
          transform-style: preserve-3d;
          transform: scale(var(--us-scale));
        }
        [data-composition-id="ui-stack-3d"] .us-rig {
          position: absolute;
          transform-style: preserve-3d;
        }
        [data-composition-id="ui-stack-3d"] .us-shadow {
          position: absolute;
          left: -520px;
          top: 250px;
          width: 1040px;
          height: 150px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(20, 30, 60, 0.22), transparent);
          filter: blur(18px);
          transform: rotateX(80deg);
        }
        /* A window = a stack of slabs (thickness) + the face. */
        [data-composition-id="ui-stack-3d"] .us-win {
          position: absolute;
          width: 780px;
          height: 500px;
          margin: -250px 0 0 -390px;
          transform-style: preserve-3d;
        }
        [data-composition-id="ui-stack-3d"] .us-slab {
          position: absolute;
          inset: 0;
          border-radius: var(--us-r);
          background: #d9deea;
        }
        [data-composition-id="ui-stack-3d"] .us-slab.s1 { transform: translateZ(-4px); background: #e3e7f0; }
        [data-composition-id="ui-stack-3d"] .us-slab.s2 { transform: translateZ(-8px); background: #d6dbe7; }
        [data-composition-id="ui-stack-3d"] .us-slab.s3 {
          transform: translateZ(-12px);
          background: #cdd3e1;
          box-shadow:
            0 2px 4px rgba(20, 30, 60, 0.06),
            0 24px 48px rgba(20, 30, 60, 0.14),
            0 60px 120px rgba(20, 30, 60, 0.12);
        }
        [data-composition-id="ui-stack-3d"] .us-face {
          position: absolute;
          inset: 0;
          border-radius: var(--us-r);
          overflow: hidden;
          background: linear-gradient(180deg, #ffffff 0%, #f4f6fb 100%);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1), inset 0 0 0 1px rgba(20, 30, 60, 0.06);
          transform-style: preserve-3d;
        }
        [data-composition-id="ui-stack-3d"] .us-bar {
          height: 64px;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 26px;
          background: linear-gradient(180deg, color-mix(in oklab, var(--us-accent) 88%, white), var(--us-accent));
        }
        [data-composition-id="ui-stack-3d"] .us-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.75);
        }
        [data-composition-id="ui-stack-3d"] .us-dot.y { background: #ffd44d; }
        [data-composition-id="ui-stack-3d"] .us-body {
          position: absolute;
          top: 64px;
          left: 0;
          right: 0;
          bottom: 0;
          padding: 34px;
          transform-style: preserve-3d;
        }
        [data-composition-id="ui-stack-3d"] .us-line {
          height: 16px;
          border-radius: 8px;
          background: rgba(20, 30, 60, 0.09);
          margin-bottom: 16px;
        }
        [data-composition-id="ui-stack-3d"] .us-side {
          position: absolute;
          left: 34px;
          top: 34px;
          width: 230px;
          bottom: 34px;
          border-radius: calc(var(--us-r) * 0.6);
          background: linear-gradient(160deg, color-mix(in oklab, var(--us-accent) 80%, white), var(--us-accent));
        }
        [data-composition-id="ui-stack-3d"] .us-lift {
          position: absolute;
          left: 200px;
          right: 60px;
          top: 110px;
          height: 230px;
          border-radius: calc(var(--us-r) * 0.7);
          background: #ffffff;
          padding: 30px 34px;
          box-shadow:
            0 1px 2px rgba(20, 30, 60, 0.08),
            0 18px 40px rgba(20, 30, 60, 0.16);
        }
        [data-composition-id="ui-stack-3d"] .us-lift .us-line { background: rgba(20, 30, 60, 0.1); }
        [data-composition-id="ui-stack-3d"] .us-lift .us-line.a {
          width: 46%;
          height: 20px;
          background: color-mix(in oklab, var(--us-accent) 70%, white);
        }
        [data-composition-id="ui-stack-3d"] .us-chart { position: absolute; left: 34px; right: 34px; bottom: 30px; height: 190px; }
        [data-composition-id="ui-stack-3d"] .us-back { filter: blur(3px); }
        [data-composition-id="ui-stack-3d"] .us-mid { filter: blur(1.2px); }
      </style>
      <div class="us-stage">
        <div class="us-shadow" id="us-shadow"></div>
        <div class="us-rig" id="us-rig">
          <!-- back window: chart -->
          <div class="us-win us-back" id="us-w3">
            <div class="us-slab s3"></div><div class="us-slab s2"></div><div class="us-slab s1"></div>
            <div class="us-face">
              <div class="us-bar"><div class="us-dot"></div><div class="us-dot"></div><div class="us-dot"></div></div>
              <div class="us-body">
                <div class="us-line" style="width: 40%"></div>
                <svg class="us-chart" viewBox="0 0 700 190" preserveAspectRatio="none">
                  <path d="M0 160 L120 120 L230 140 L340 80 L460 96 L580 40 L700 56" fill="none" stroke="rgba(20,30,60,.18)" stroke-width="6" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          </div>
          <!-- middle window: list -->
          <div class="us-win us-mid" id="us-w2">
            <div class="us-slab s3"></div><div class="us-slab s2"></div><div class="us-slab s1"></div>
            <div class="us-face">
              <div class="us-bar"><div class="us-dot"></div><div class="us-dot"></div><div class="us-dot"></div></div>
              <div class="us-body">
                <div class="us-line" style="width: 70%"></div>
                <div class="us-line" style="width: 55%"></div>
                <div class="us-line" style="width: 62%"></div>
                <div class="us-line" style="width: 48%"></div>
              </div>
            </div>
          </div>
          <!-- front window: the hero -->
          <div class="us-win" id="us-w1">
            <div class="us-slab s3"></div><div class="us-slab s2"></div><div class="us-slab s1"></div>
            <div class="us-face">
              <div class="us-bar"><div class="us-dot"></div><div class="us-dot"></div><div class="us-dot y"></div></div>
              <div class="us-body">
                <div class="us-side"></div>
                <div class="us-line" style="margin-left: 266px; width: 34%"></div>
                <!-- edit: the lifted card (replace lines with real labels if you have them) -->
                <div class="us-lift" id="us-lift">
                  <div class="us-line a"></div>
                  <div class="us-line" style="width: 82%"></div>
                  <div class="us-line" style="width: 64%"></div>
                  <div class="us-line" style="width: 72%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const FAN_AT = 0.2;
        const LIFT_AT = 1.7;
        const tl = gsap.timeline({ paused: true });
        // Slow camera: the whole rig turns toward the viewer and rises.
        tl.fromTo(
          "#us-rig",
          { rotationX: 16, rotationY: -26, y: 40 },
          { rotationX: 9, rotationY: -12, y: 0, duration: 5, ease: "power2.out" },
          0,
        );
        // Windows start stacked on top of each other, then fan out in depth.
        tl.fromTo("#us-w3", { x: 0, y: 0, z: 0, opacity: 0 }, { x: 250, y: -120, z: -260, opacity: 1, duration: 1.4, ease: "expo.out" }, FAN_AT);
        tl.fromTo("#us-w2", { x: 0, y: 0, z: 0, opacity: 0 }, { x: 130, y: -60, z: -130, opacity: 1, duration: 1.4, ease: "expo.out" }, FAN_AT + 0.08);
        tl.fromTo("#us-w1", { y: 60, z: -40, opacity: 0 }, { y: 0, z: 0, opacity: 1, duration: 1.2, ease: "expo.out" }, FAN_AT + 0.16);
        tl.fromTo("#us-shadow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.4, ease: "expo.out" }, FAN_AT);
        // Hero beat: the inner card lifts out of the window toward the camera.
        tl.fromTo(
          "#us-lift",
          { z: 0, boxShadow: "0 1px 2px rgba(20,30,60,.08), 0 6px 14px rgba(20,30,60,.10)" },
          { z: 90, boxShadow: "0 2px 4px rgba(20,30,60,.10), 0 40px 70px rgba(20,30,60,.22)", duration: 1.1, ease: "expo.out" },
          LIFT_AT,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["ui-stack-3d"] = tl;
      })();
    </script>
  </body>
</html>
