<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/looks/editorial-ink.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--field);
        overflow: hidden;
        font-family: var(--text);
        color: var(--ink);
      }
      /* Lamplight spill from the upper left, heavy vignette, printed grain. */
      .light {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 1100px 800px at 18% 20%, rgba(227, 168, 87, 0.1), transparent 70%),
          radial-gradient(ellipse 1500px 1000px at 50% 50%, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.16;
        mix-blend-mode: overlay;
      }
      .chapter {
        position: absolute;
        left: 150px;
        top: 214px;
        font-size: 30px;
        font-weight: 400;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      .title {
        position: absolute;
        left: 144px;
        top: 262px;
        font-family: var(--display);
        font-weight: var(--display-weight);
        letter-spacing: var(--display-tracking);
        font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
        font-size: 150px;
        line-height: 0.98;
      }
      .title div {
        overflow: hidden;
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }
      .title span {
        display: block;
      }
      .rule {
        position: absolute;
        left: 150px;
        top: 640px;
        width: 96px;
        height: 2px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      .quote {
        position: absolute;
        left: 150px;
        top: 690px;
        width: 860px;
        font-style: italic;
        font-weight: 360;
        font-variation-settings: "opsz" 48;
        font-size: 52px;
        line-height: 1.16;
        letter-spacing: -0.01em;
      }
      .by {
        position: absolute;
        left: 150px;
        top: 846px;
        font-size: 26px;
        font-weight: 400;
        color: var(--muted);
      }
      .by b {
        font-weight: 560;
        color: var(--ink);
      }
      .plate {
        position: absolute;
        left: 1170px;
        top: 214px;
        width: 600px;
        height: 600px;
      }
      .caption {
        position: absolute;
        left: 1170px;
        top: 846px;
        width: 600px;
        text-align: center;
        font-style: italic;
        font-size: 26px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="look-editorial-ink"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div class="light"></div>
      <svg class="plate" id="plate" viewBox="0 0 600 600">
        <defs>
          <clipPath id="porthole"><circle cx="300" cy="300" r="298" /></clipPath>
          <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e3a857" stop-opacity="0.75" />
            <stop offset="1" stop-color="#e3a857" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0" stop-color="#e3a857" stop-opacity="0.45" />
            <stop offset="1" stop-color="#e3a857" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="glow">
            <stop offset="0" stop-color="#e3a857" stop-opacity="0.9" />
            <stop offset="1" stop-color="#e3a857" stop-opacity="0" />
          </radialGradient>
        </defs>
        <g clip-path="url(#porthole)">
          <rect width="600" height="600" fill="#0b211c" />
          <g id="beams">
            <polygon points="300,208 760,70 760,330 300,218" fill="url(#beamR)" />
            <polygon points="300,208 -160,70 -160,330 300,218" fill="url(#beamL)" />
          </g>
          <circle id="glow" cx="300" cy="213" r="46" fill="url(#glow)" />
          <g fill="none" stroke="#ece4d4" stroke-width="2" stroke-linecap="round">
            <path class="draw" d="M0 404 L600 404" stroke-opacity="0.5" />
            <path class="draw" d="M340 440 L600 440 M420 470 L600 470 M470 500 L600 500 M520 530 L600 530" stroke-opacity="0.35" />
            <path class="draw" d="M0 470 L90 446 L150 452 L210 424 L262 412 L338 412 L372 428 L402 424 L446 452" fill="#0b211c" />
            <path class="draw" d="M264 412 L280 232 L320 232 L336 412 Z" fill="#0b211c" />
            <path class="draw" d="M270 350 L330 350 M275 290 L325 290" stroke-opacity="0.6" />
            <path class="draw" d="M266 232 L334 232 M286 232 L286 196 L314 196 L314 232 M280 196 L300 176 L320 196 Z" fill="#0b211c" />
          </g>
          <circle cx="300" cy="213" r="7" fill="#e3a857" />
        </g>
        <circle cx="300" cy="300" r="298" fill="none" stroke="#ece4d4" stroke-opacity="0.55" stroke-width="2" />
      </svg>
      <!-- edit: chapter -->
      <div class="chapter" id="chapter">Chapter one · The keeper</div>
      <!-- edit: title, one line per div -->
      <div class="title" id="title">
        <div><span>The last keeper</span></div>
        <div><span>of the light</span></div>
      </div>
      <div class="rule" id="rule"></div>
      <!-- edit: quote and attribution -->
      <div class="quote" id="quote">“Every night for forty-one years,<br />I lit it anyway.”</div>
      <div class="by" id="by"><b>Margaret Eunson</b>, keeper 1962 – 2003</div>
      <div class="caption" id="caption">Muckle Flugga, Shetland</div>
      <svg class="grain" width="1920" height="1080">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1920" height="1080" filter="url(#noise)" />
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      document.querySelectorAll(".draw").forEach((p) => {
        const l = p.getTotalLength();
        gsap.set(p, { strokeDasharray: l, strokeDashoffset: l });
      });

      tl.from("#plate", { opacity: 0, scale: 0.97, transformOrigin: "50% 50%", duration: 1.6, ease: "power2.out" }, 0)
        .to(".draw", { strokeDashoffset: 0, duration: 1.8, ease: "sine.inOut", stagger: 0.12 }, 0.1)
        .fromTo("#beams", { rotation: -24, svgOrigin: "300 213", opacity: 0 }, { rotation: 10, svgOrigin: "300 213", opacity: 1, duration: 3.9, ease: "sine.inOut" }, 0.1)
        .from("#glow", { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 0.6)
        .from("#chapter", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 0.3)
        .from("#title span", { yPercent: 100, duration: 1.4, ease: "power3.out", stagger: 0.18 }, 0.45)
        .from("#rule", { scaleX: 0, duration: 1.0, ease: "power2.inOut" }, 1.3)
        .from("#quote", { opacity: 0, y: 16, filter: "blur(6px)", duration: 1.4, ease: "power2.out" }, 1.6)
        .from("#by, #caption", { opacity: 0, duration: 1.0, ease: "sine.inOut", stagger: 0.2 }, 2.3)
        .to({}, { duration: 0.1 }, 3.9);
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
