<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/looks/blueprint.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--field);
        overflow: hidden;
        font-family: var(--text);
        color: var(--ink);
      }
      /* Drafting grid: 24px minor, 120px major, plus a soft lamp falloff. */
      .grid {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.11) 1px, transparent 1px) 0 0 / 120px 120px,
          linear-gradient(180deg, rgba(255, 255, 255, 0.11) 1px, transparent 1px) 0 0 / 120px 120px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 24px 24px,
          linear-gradient(180deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 24px 24px;
      }
      .lamp {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 1200px 800px at 62% 44%, rgba(120, 170, 255, 0.16), transparent 70%),
          radial-gradient(ellipse 1500px 1000px at 50% 50%, transparent 55%, rgba(6, 20, 70, 0.45) 100%);
      }
      .sheet {
        position: absolute;
        left: 48px;
        top: 48px;
        width: 1820px;
        height: 980px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        box-sizing: border-box;
      }
      .headline {
        position: absolute;
        left: 144px;
        top: 150px;
        margin: 0;
        font-family: var(--display);
        font-weight: var(--display-weight);
        font-stretch: var(--display-stretch);
        letter-spacing: var(--display-tracking);
        font-size: 96px;
        line-height: 1.04;
      }
      .headline span {
        display: block;
        clip-path: inset(0 100% 0 0);
      }
      .dek {
        position: absolute;
        left: 144px;
        top: 390px;
        width: 560px;
        margin: 0;
        font-size: 30px;
        line-height: 1.4;
        font-weight: 400;
        font-stretch: 104%;
        color: var(--muted);
      }
      .ratio {
        position: absolute;
        left: 144px;
        top: 640px;
      }
      .ratio .k {
        font-family: var(--mono);
        font-size: 18px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .ratio .v {
        margin-top: 60px;
        font-family: var(--display);
        font-weight: 600;
        font-stretch: 125%;
        font-size: 150px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--accent);
      }
      svg.draw {
        position: absolute;
        left: 0;
        top: 0;
      }
      .note {
        font-family: var(--mono);
        font-size: 17px;
        letter-spacing: 0.02em;
        fill: var(--ink);
      }
      .note.dim {
        fill: var(--accent);
        font-size: 19px;
      }
      /* Title block: the drawing's metadata, bottom-right, as on a real sheet. */
      .block {
        position: absolute;
        left: 1420px;
        top: 874px;
        width: 400px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-bottom: none;
        border-right: none;
        font-family: var(--mono);
        font-size: 15px;
        color: var(--muted);
      }
      .block div {
        padding: 12px 16px 14px;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        line-height: 1.5;
      }
      .block div:nth-child(2n) {
        border-right: none;
      }
      .block .title {
        grid-column: 1 / 3;
        font-family: var(--display);
        font-size: 26px;
        font-weight: 640;
        font-stretch: 112%;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="look-blueprint"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div class="grid" id="grid"></div>
      <div class="lamp"></div>
      <div class="sheet" id="sheet"></div>

      <!-- edit: headline (one line per span) -->
      <h1 class="headline"><span>Torque, traded</span><span>for speed.</span></h1>
      <!-- edit: dek -->
      <p class="dek" id="dek">A small gear driving one twice its size turns half as fast, and pushes twice as hard.</p>
      <div class="ratio" id="ratio">
        <!-- edit: key figure label and value -->
        <div class="k">Reduction ratio</div>
        <div class="v">2 : 1</div>
      </div>

      <svg class="draw" width="1920" height="1080" viewBox="0 0 1920 1080">
        <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
          <!-- centre lines (dash-dot), drawn first -->
          <g id="centres" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="28 6 4 6">
            <line x1="850" y1="560" x2="1680" y2="560" />
            <line x1="1060" y1="400" x2="1060" y2="720" />
            <line x1="1396" y1="290" x2="1396" y2="830" />
          </g>
          <!-- pitch circles, dashed -->
          <g id="pitch" stroke="rgba(255,255,255,0.42)" stroke-width="1.5" stroke-dasharray="10 8">
            <circle cx="1060" cy="560" r="112" />
            <circle cx="1396" cy="560" r="224" />
          </g>
          <g id="driver" stroke-width="3"></g>
          <g id="driven" stroke-width="3"></g>
          <!-- dimension: centre distance -->
          <g id="dimA" stroke-width="1.5">
            <line x1="1060" y1="740" x2="1060" y2="890" />
            <line x1="1396" y1="810" x2="1396" y2="890" />
            <line x1="1060" y1="870" x2="1396" y2="870" />
            <path d="M1060 870 l18 -6 v12 z M1396 870 l-18 -6 v12 z" fill="#ffffff" />
          </g>
          <!-- leader: driver -->
          <g id="leadA" stroke-width="1.5">
            <path d="M1003 470 L930 330 H840" />
            <circle cx="1003" cy="470" r="5" fill="#ffffff" />
          </g>
          <!-- leader: driven -->
          <g id="leadB" stroke-width="1.5">
            <path d="M1552 400 L1640 300 H1740" />
            <circle cx="1552" cy="400" r="5" fill="#ffffff" />
          </g>
          <!-- contact point, the one yellow mark -->
          <g id="contact" stroke="#ffd84a" stroke-width="2.5">
            <circle cx="1172" cy="560" r="16" />
            <line x1="1172" y1="520" x2="1172" y2="600" />
          </g>
        </g>
        <!-- edit: annotations -->
        <text class="note" id="tA" x="840" y="318">DRIVER · z = 16</text>
        <text class="note" id="tB" x="1640" y="288">DRIVEN · z = 32</text>
        <text class="note dim" id="tD" x="1228" y="858" text-anchor="middle">a = 336</text>
      </svg>

      <div class="block" id="block">
        <!-- edit: title block -->
        <div class="title">Spur gear reduction</div>
        <div>Module 14</div>
        <div>Scale 1 : 2</div>
        <div>Sheet 2 of 6</div>
        <div>Rev C</div>
      </div>
    </div>
    <script>
      // Build involute-ish spur gears as polygons (deterministic geometry).
      const NS = "http://www.w3.org/2000/svg";
      function gear(cx, cy, z, m, holes) {
        const r = (m * z) / 2;
        const tip = r + m;
        const root = r - 1.25 * m;
        const p = (Math.PI * 2) / z;
        const pts = [];
        for (let i = 0; i < z; i++) {
          const a = i * p;
          const at = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
          pts.push(at(root, a - 0.5 * p), at(root, a - 0.28 * p), at(tip, a - 0.14 * p), at(tip, a + 0.14 * p), at(root, a + 0.28 * p));
        }
        const d = "M" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L") + " Z";
        const parts = [d];
        const hub = r * 0.34;
        parts.push(`M${cx + hub} ${cy} A${hub} ${hub} 0 1 0 ${cx - hub} ${cy} A${hub} ${hub} 0 1 0 ${cx + hub} ${cy}`);
        const bore = r * 0.14;
        parts.push(
          `M${cx - bore} ${cy} A${bore} ${bore} 0 1 0 ${cx + bore} ${cy} L${cx + bore} ${cy - bore * 0.6} L${cx + bore * 0.55} ${cy - bore * 0.6} L${cx + bore * 0.55} ${cy - bore * 0.86} A${bore} ${bore} 0 0 0 ${cx - bore} ${cy} Z`,
        );
        for (let h = 0; h < holes; h++) {
          const a = (h / holes) * Math.PI * 2 + Math.PI / holes;
          const hr = r * 0.13;
          const hx = cx + r * 0.62 * Math.cos(a);
          const hy = cy + r * 0.62 * Math.sin(a);
          parts.push(`M${hx + hr} ${hy} A${hr} ${hr} 0 1 0 ${hx - hr} ${hy} A${hr} ${hr} 0 1 0 ${hx + hr} ${hy}`);
        }
        return parts.map((dd) => {
          const el = document.createElementNS(NS, "path");
          el.setAttribute("d", dd);
          return el;
        });
      }
      const driver = document.getElementById("driver");
      const driven = document.getElementById("driven");
      gear(1060, 560, 16, 14, 0).forEach((el) => driver.appendChild(el));
      gear(1396, 560, 32, 14, 6).forEach((el) => driven.appendChild(el));
      // Half-pitch phase so the teeth mesh at the contact point.
      gsap.set(driven, { rotation: 180 / 32, svgOrigin: "1396 560" });
      gsap.set(driver, { svgOrigin: "1060 560" });

      const strokes = gsap.utils.toArray("#centres line, #pitch circle, #driver path, #driven path, #dimA line, #leadA path, #leadB path");
      strokes.forEach((el) => {
        const len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
      });
      // Dash-dot and dashed strokes: reveal with a clip instead of dash offset.
      gsap.set("#centres line, #pitch circle", { clearProps: "strokeDasharray,strokeDashoffset" });

      const tl = gsap.timeline({ paused: true });
      tl.from("#grid", { opacity: 0, duration: 0.8, ease: "power1.inOut" }, 0)
        .from("#sheet", { opacity: 0, scale: 1.015, duration: 0.8, ease: "power2.out" }, 0)
        .from("#centres line", { opacity: 0, duration: 0.4, stagger: 0.08, ease: "none" }, 0.2)
        .from("#pitch circle", { opacity: 0, duration: 0.5, stagger: 0.1, ease: "none" }, 0.4)
        .to(".headline span", { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power3.inOut", stagger: 0.14 }, 0.25)
        .from("#dek", { opacity: 0, y: 16, duration: 0.7, ease: "power2.out" }, 0.8)
        .to("#driver path", { strokeDashoffset: 0, duration: 1.1, ease: "power1.inOut", stagger: 0.06 }, 0.5)
        .to("#driven path", { strokeDashoffset: 0, duration: 1.4, ease: "power1.inOut", stagger: 0.05 }, 0.6)
        .to("#dimA line, #leadA path, #leadB path", { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut", stagger: 0.08 }, 1.8)
        .from("#dimA path, #leadA circle, #leadB circle", { opacity: 0, duration: 0.2, stagger: 0.08 }, 2.1)
        .from("#tA, #tB", { opacity: 0, duration: 0.3, stagger: 0.1, ease: "none" }, 2.2)
        .from("#contact", { opacity: 0, scale: 0.4, svgOrigin: "1172 560", duration: 0.5, ease: "back.out(2)" }, 2.3)
        .from("#tD", { opacity: 0, duration: 0.3, ease: "none" }, 2.4)
        .from("#ratio", { opacity: 0, y: 20, duration: 0.7, ease: "power3.out" }, 2.3)
        .from("#block", { opacity: 0, duration: 0.5, ease: "none" }, 2.0)
        // Once drawn, the pair turns: driver a full 60°, driven half that, the other way.
        .to(driver, { rotation: 60, duration: 2.2, ease: "power1.inOut" }, 1.8)
        .to(driven, { rotation: 180 / 32 - 30, duration: 2.2, ease: "power1.inOut" }, 1.8)
        .to({}, { duration: 0.1 }, 3.9);
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
