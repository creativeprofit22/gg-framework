<!doctype html>
<!--
  mesh-gradient: a slow, restrained mesh gradient in the look's own colors.
  Four soft blobs (--field-2, --accent, --field-2 and a light lift) drift on
  seeded sine paths over --field, drawn on a small canvas and scaled up so
  they stay buttery; a fine per-frame grain sits on top to kill banding.
  Every frame is a pure function of the timeline time.
  Params (top of script): BLOBS (x/y/radius as fractions of the frame,
  sine amplitude, speed, phase, strength), SPEED (global drift multiplier),
  GRAIN (grain alpha 0–1), GRAIN_FPS. CSS: --mg-blur (extra softening).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="mesh-gradient-root"
      data-composition-id="mesh-gradient"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="mesh-gradient"] {
          --mg-blur: 18px;
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--field, #d9774f);
        }
        [data-composition-id="mesh-gradient"] canvas {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        [data-composition-id="mesh-gradient"] .mg-mesh {
          filter: blur(var(--mg-blur));
          transform: scale(1.06);
        }
        [data-composition-id="mesh-gradient"] .mg-grain {
          mix-blend-mode: overlay;
        }
      </style>
      <canvas class="mg-mesh" id="mg-mesh" width="480" height="270"></canvas>
      <canvas class="mg-grain" id="mg-grain" width="960" height="540"></canvas>
    </div>
    <script>
      (function () {
        const DURATION = 8;
        const SPEED = 1;
        const GRAIN = 0.06;
        const GRAIN_FPS = 12;
        // token: which color; x/y/r: fractions of the frame; ax/ay: sine
        // amplitude; w: angular speed (rad/s); p: phase; a: peak alpha.
        const BLOBS = [
          { token: "--field-2", fb: "#0f1e3d", x: 0.12, y: 0.95, r: 0.62, ax: 0.08, ay: 0.05, w: 0.21, p: 0.4, a: 0.6 },
          { token: "--accent", fb: "#0f1e3d", x: 0.88, y: 0.1, r: 0.48, ax: 0.07, ay: 0.08, w: 0.17, p: 2.1, a: 0.38 },
          { token: "--field-2", fb: "#0f1e3d", x: 0.98, y: 0.92, r: 0.4, ax: 0.05, ay: 0.06, w: 0.25, p: 4.0, a: 0.45 },
          { token: "light", fb: "#ffffff", x: 0.38, y: 0.3, r: 0.5, ax: 0.1, ay: 0.06, w: 0.14, p: 1.3, a: 0.2 },
        ];
        const root = document.querySelector('[data-composition-id="mesh-gradient"]');
        const mesh = document.getElementById("mg-mesh");
        const grain = document.getElementById("mg-grain");
        const mctx = mesh.getContext("2d");
        const gctx = grain.getContext("2d");
        const gimg = gctx.createImageData(grain.width, grain.height);

        function rgb(token, fb) {
          if (token === "light") return [255, 255, 255];
          const probe = document.createElement("i");
          probe.style.color = `var(${token}, ${fb})`;
          root.appendChild(probe);
          const m = getComputedStyle(probe).color.match(/[\d.]+/g).map(Number);
          probe.remove();
          return m.slice(0, 3);
        }
        // Resolve token colors once, at build time (never inside the callback).
        for (const b of BLOBS) b.rgb = rgb(b.token, b.fb);
        function hash(a, b) {
          let h = Math.imul(a, 374761393) + Math.imul(b, 668265263);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }

        let lastGrainFrame = -1;
        const state = { t: 0 };
        function draw() {
          const t = state.t * SPEED;
          const W = mesh.width;
          const H = mesh.height;
          mctx.clearRect(0, 0, W, H);
          for (const b of BLOBS) {
            const [r, g, bl] = b.rgb;
            const cx = (b.x + b.ax * Math.sin(t * b.w + b.p)) * W;
            const cy = (b.y + b.ay * Math.cos(t * b.w * 0.8 + b.p * 1.7)) * H;
            const rad = b.r * W * (1 + 0.05 * Math.sin(t * b.w * 1.3 + b.p));
            const grad = mctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
            grad.addColorStop(0, `rgba(${r},${g},${bl},${b.a})`);
            grad.addColorStop(0.45, `rgba(${r},${g},${bl},${b.a * 0.55})`);
            grad.addColorStop(1, `rgba(${r},${g},${bl},0)`);
            mctx.fillStyle = grad;
            mctx.fillRect(0, 0, W, H);
          }
          const frame = Math.floor(state.t * GRAIN_FPS);
          if (frame === lastGrainFrame) return;
          lastGrainFrame = frame;
          const d = gimg.data;
          const GW = grain.width;
          for (let i = 0, n = GW * grain.height; i < n; i++) {
            const v = hash(i, frame + 7) * 255;
            const o = i * 4;
            d[o] = d[o + 1] = d[o + 2] = v;
            d[o + 3] = GRAIN * 255;
          }
          gctx.putImageData(gimg, 0, 0);
        }

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(state, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: draw }, 0);
        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["mesh-gradient"] = tl;
      })();
    </script>
  </body>
</html>
