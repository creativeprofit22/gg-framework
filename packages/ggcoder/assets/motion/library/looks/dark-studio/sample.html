<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/looks/dark-studio.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--field);
        overflow: hidden;
        font-family: var(--text);
        color: var(--ink);
      }
      /* Key light: one soft overhead source, falling off to black at the edges. */
      .key {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 620px at 50% -8%, rgba(196, 214, 240, 0.2), rgba(196, 214, 240, 0.05) 55%, transparent 80%),
          radial-gradient(ellipse 1400px 500px at 50% 112%, rgba(124, 199, 255, 0.07), transparent 70%);
      }
      .floor {
        position: absolute;
        left: 0;
        right: 0;
        top: 900px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(243, 245, 248, 0.12) 30%, rgba(243, 245, 248, 0.12) 70%, transparent);
      }
      .eyebrow {
        position: absolute;
        top: 100px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: 560;
        font-stretch: 110%;
        letter-spacing: -0.01em;
        color: var(--accent);
      }
      .headline {
        position: absolute;
        top: 200px;
        width: 100%;
        text-align: center;
        font-family: var(--display);
        font-weight: var(--display-weight);
        font-stretch: var(--display-stretch);
        letter-spacing: var(--display-tracking);
        font-size: 118px;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 30%, #9aa3ae 110%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .headline span {
        display: inline-block;
        line-height: 1.2;
        padding: 0.1em 0.12em 0.16em;
        margin: -0.2em -0.12em -0.16em;
        background: inherit;
        -webkit-background-clip: text;
        background-clip: text;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 380px;
        width: 1920px;
        height: 700px;
        perspective: 2200px;
        perspective-origin: 50% 0%;
      }
      .reflection {
        position: absolute;
        left: 460px;
        top: 470px;
        width: 1000px;
        height: 120px;
        background: radial-gradient(ellipse at 50% 50%, rgba(124, 199, 255, 0.22), transparent 70%);
        filter: blur(30px);
      }
      .slab {
        position: absolute;
        left: 320px;
        top: 0;
        width: 1280px;
        height: 560px;
        border-radius: var(--radius);
        transform-origin: 50% 100%;
        transform: rotateX(14deg);
        background: linear-gradient(180deg, rgba(34, 38, 45, 0.96), rgba(16, 18, 22, 0.98));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.07),
          0 60px 120px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(0, 0, 0, 0.9);
        overflow: hidden;
      }
      .bar {
        height: 56px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 24px;
      }
      .bar i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: rgba(243, 245, 248, 0.16);
      }
      .side {
        position: absolute;
        left: 0;
        top: 57px;
        bottom: 0;
        width: 260px;
        border-right: 1px solid var(--line);
        padding: 28px 24px;
        box-sizing: border-box;
      }
      .side div {
        height: 40px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        padding-left: 16px;
        font-size: 20px;
        font-weight: 500;
        color: var(--muted);
      }
      .side .on {
        background: rgba(124, 199, 255, 0.12);
        color: var(--ink);
      }
      .main {
        position: absolute;
        left: 300px;
        top: 96px;
        right: 48px;
      }
      .label {
        font-size: 22px;
        font-weight: 500;
        color: var(--muted);
      }
      .big {
        margin-top: 30px;
        font-family: var(--display);
        font-weight: 560;
        font-stretch: 112%;
        letter-spacing: -0.04em;
        font-size: 112px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .big small {
        font-size: 44px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: -0.01em;
        margin-left: 10px;
      }
      .delta {
        margin-top: 16px;
        font-size: 22px;
        font-weight: 560;
        color: var(--accent);
      }
      .chart {
        position: absolute;
        left: 740px;
        top: 150px;
      }
      .rows {
        position: absolute;
        left: 300px;
        right: 48px;
        top: 376px;
      }
      .rows div {
        display: flex;
        align-items: center;
        height: 52px;
        border-top: 1px solid var(--line);
        font-size: 20px;
        color: var(--muted);
      }
      .rows b {
        font-weight: 560;
        color: var(--ink);
        width: 360px;
      }
      .rows em {
        font-style: normal;
        margin-left: auto;
        font-family: var(--mono);
        font-size: 17px;
      }
      .rows i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 18px;
        box-shadow: 0 0 12px var(--accent);
      }
      .sheen {
        position: absolute;
        top: -20%;
        left: 0;
        width: 380px;
        height: 140%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.07) 45%, rgba(255, 255, 255, 0.11) 50%, transparent 60%);
        transform: translateX(-500px) skewX(-12deg);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="look-dark-studio"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div class="key" id="key"></div>
      <div class="floor"></div>
      <!-- edit: eyebrow -->
      <div class="eyebrow" id="eyebrow">Introducing Relay 2</div>
      <!-- edit: headline -->
      <div class="headline" id="headline"><span>Every</span> <span>deploy,</span> <span>one</span> <span>view.</span></div>
      <div class="stage">
        <div class="reflection" id="reflection"></div>
        <div class="slab" id="slab">
          <div class="bar"><i></i><i></i><i></i></div>
          <div class="side">
            <div>Overview</div>
            <div class="on">Deployments</div>
            <div>Edge network</div>
            <div>Logs</div>
            <div>Settings</div>
          </div>
          <div class="main">
            <div class="label">Median cold start</div>
            <div class="big"><span id="ms">142</span><small>ms</small></div>
            <div class="delta">38% faster than last release</div>
          </div>
          <svg class="chart" width="480" height="200" viewBox="0 0 480 200">
            <defs>
              <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7cc7ff" stop-opacity="0.28" />
                <stop offset="1" stop-color="#7cc7ff" stop-opacity="0" />
              </linearGradient>
              <clipPath id="reveal"><rect id="revealRect" x="0" y="0" width="480" height="200" /></clipPath>
            </defs>
            <g clip-path="url(#reveal)">
              <path d="M0 40 C60 44 90 70 140 78 S230 96 270 120 S360 150 400 158 S450 164 480 166 L480 200 L0 200 Z" fill="url(#area)" />
            </g>
            <path id="line" d="M0 40 C60 44 90 70 140 78 S230 96 270 120 S360 150 400 158 S450 164 480 166" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
            <circle id="dot" cx="480" cy="166" r="8" fill="var(--accent)" />
          </svg>
          <div class="rows">
            <div><i></i><b>api-gateway</b>Production · eu-west<em>31s ago</em></div>
            <div><i></i><b>checkout-web</b>Production · us-east<em>2m ago</em></div>
            <div><i></i><b>search-indexer</b>Preview · ap-south<em>6m ago</em></div>
          </div>
          <div class="sheen" id="sheen"></div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const line = document.getElementById("line");
      const len = line.getTotalLength();
      gsap.set(line, { strokeDasharray: len, strokeDashoffset: len });
      const ms = { v: 371 };

      tl.from("#key", { opacity: 0, duration: 1.4, ease: "power2.inOut" }, 0)
        .from("#eyebrow", { opacity: 0, y: 14, duration: 0.8, ease: "power3.out" }, 0.25)
        .from(
          "#headline span",
          { opacity: 0, y: 44, filter: "blur(16px)", duration: 1.1, ease: "power3.out", stagger: 0.07 },
          0.35,
        )
        .from("#slab", { y: 260, rotateX: 42, opacity: 0, duration: 1.8, ease: "expo.out" }, 0.7)
        .from("#reflection", { opacity: 0, duration: 1.6, ease: "power2.out" }, 1.0)
        .to(line, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 1.4)
        .from("#revealRect", { attr: { width: 0 }, duration: 1.3, ease: "power2.inOut" }, 1.4)
        .from("#dot", { scale: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, 2.55)
        .to(
          ms,
          {
            v: 142,
            duration: 1.3,
            ease: "power2.inOut",
            onUpdate: () => (document.getElementById("ms").textContent = Math.round(ms.v)),
          },
          1.4,
        )
        .to("#sheen", { x: 1700, duration: 1.4, ease: "power1.inOut" }, 1.9)
        .to({}, { duration: 0.1 }, 3.9);
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
