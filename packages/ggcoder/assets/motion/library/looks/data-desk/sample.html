<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="assets/fonts/fonts.css"><link rel="stylesheet" href="assets/looks/data-desk.css"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}#root{position:relative;width:1920px;height:1080px;background:var(--field);color:var(--ink);font-family:var(--text)}
.header{position:absolute;left:96px;right:96px;top:72px;padding-bottom:28px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;font:22px/1.4 var(--mono)}
.finding{position:absolute;left:96px;top:250px;width:510px}h1{font:650 76px/1.08 var(--display);letter-spacing:var(--display-tracking);margin:0 0 52px}.value{font:650 144px/1 var(--display);letter-spacing:-.06em}.finding p{font-size:28px;line-height:1.5;color:var(--muted);max-width:440px}
.chart{position:absolute;left:680px;top:230px;width:1140px;height:640px}.grid{stroke:var(--line);stroke-width:1.5}.axis{fill:var(--muted);font:20px var(--mono)}.trend{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accent);opacity:.08}.point{fill:var(--accent)}.note{font:24px var(--mono);fill:var(--ink)}
.footer{position:absolute;left:96px;right:96px;bottom:72px;border-top:2px solid var(--line);padding-top:24px;font:20px/1.5 var(--mono);color:var(--muted)}
</style></head><body><div id="root" class="look-data-desk" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<!-- edit: report title and finding; sample data is illustrative -->
<div class="header"><span>FIELD REPORT / 04</span><span>INDEXED SERIES · JAN–JUN</span></div><section class="finding"><h1>A steadier<br>climb.</h1><div class="value">+28%</div><p>Growth from the same baseline, shown on the same scale.</p></section>
<svg class="chart" viewBox="0 0 1140 640" aria-label="Illustrative index rising from 100 in January to 128 in June">
<g class="grid"><path d="M80 80H1080 M80 220H1080 M80 360H1080 M80 500H1080"/></g>
<g class="axis"><text x="0" y="88">130</text><text x="0" y="228">120</text><text x="0" y="368">110</text><text x="0" y="508">100</text><text x="80" y="565">JAN</text><text x="280" y="565">FEB</text><text x="480" y="565">MAR</text><text x="680" y="565">APR</text><text x="880" y="565">MAY</text><text x="1030" y="565">JUN</text></g>
<path class="area" d="M80 500L280 458L480 360L680 304L880 206L1080 108V500Z"/><path class="trend" d="M80 500L280 458L480 360L680 304L880 206L1080 108"/><circle class="point" cx="1080" cy="108" r="10"/><text class="note" x="994" y="62">128</text></svg>
<div class="footer">ILLUSTRATIVE DATA / Index: January = 100 / Replace with verified data and source.</div></div>
<script>(()=>{const path=document.querySelector('.trend');const length=path.getTotalLength();const tl=gsap.timeline({paused:true});tl.from('.header',{opacity:0,duration:.35},0).from('.grid,.axis',{opacity:0,duration:.5},.2).fromTo(path,{strokeDasharray:length,strokeDashoffset:length},{strokeDashoffset:0,duration:1.5,ease:'power2.inOut'},.5).from('.area',{opacity:0,duration:.7},1.3).from('.point,.note',{opacity:0,duration:.3},1.8).from('.finding',{y:24,opacity:0,duration:.6},1.4).from('.footer',{opacity:0,duration:.4},2).to({},{duration:2.6});window.__timelines={main:tl};})();</script></body></html>
