<!doctype html>
<!-- Iris circle: closes to a full accent field at .8s, then opens. Edit ORIGIN to focus the reveal. -->
<html lang="en"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script></head><body>
<div id="iris-circle-root" data-composition-id="iris-circle" data-start="0" data-duration="2.4" data-width="1920" data-height="1080">
<style>[data-composition-id="iris-circle"]{position:absolute;inset:0;overflow:hidden}[data-composition-id="iris-circle"] .disc{position:absolute;inset:0;background:var(--accent);color:var(--field);clip-path:circle(0% at 50% 50%)}</style>
<div class="disc"></div></div><script>(()=>{const ORIGIN='50% 50%';const root=document.querySelector('[data-composition-id="iris-circle"]');const disc=root.querySelector('.disc');const tl=gsap.timeline({paused:true});tl.fromTo(disc,{clipPath:`circle(0% at ${ORIGIN})`},{clipPath:`circle(80% at ${ORIGIN})`,duration:.8,ease:'power3.inOut'},0).to(disc,{clipPath:`circle(0% at ${ORIGIN})`,duration:.9,ease:'power3.inOut'},1.1).to({},{duration:.4});window.__timelines=window.__timelines||{};window.__timelines["iris-circle"]=tl;})();</script></body></html>
