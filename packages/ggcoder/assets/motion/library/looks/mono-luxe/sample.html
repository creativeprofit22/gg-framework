<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="assets/fonts/fonts.css"><link rel="stylesheet" href="assets/looks/mono-luxe.css"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--field);color:var(--ink);font-family:var(--text)}
.wordmark{position:absolute;left:112px;top:84px;font-size:24px;letter-spacing:.18em;line-height:1.4}.copy{position:absolute;left:112px;top:355px;width:830px}h1{font:400 140px/1.08 var(--display);letter-spacing:var(--display-tracking);margin:0 0 45px}.copy p{font-size:27px;line-height:1.5;max-width:440px;color:var(--muted)}
.object{position:absolute;left:1130px;top:200px;width:480px;height:540px;border:90px solid var(--ink);border-radius:50% 50% 46% 46%;box-sizing:border-box;transform:rotate(-16deg);box-shadow:inset 14px 9px 18px color-mix(in srgb,var(--field) 18%,transparent),18px 12px 24px color-mix(in srgb,var(--ink) 16%,transparent)}
.plinth{position:absolute;left:990px;top:770px;width:780px;height:130px;background:linear-gradient(110deg,var(--field),var(--line));color:var(--ink);border-top:2px solid var(--line);box-shadow:32px 42px 48px color-mix(in srgb,var(--ink) 14%,transparent)}
.shadow{position:absolute;left:1180px;top:740px;width:410px;height:36px;background:var(--ink);color:var(--field);border-radius:50%;filter:blur(18px);opacity:.25}
.footer{position:absolute;left:112px;right:112px;bottom:68px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px;font-size:20px;line-height:1.4;color:var(--muted)}
</style></head><body><div id="root" class="look-mono-luxe" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<!-- edit: illustrative collection and copy --><div class="wordmark">FORM STUDIES</div><section class="copy"><h1>Nothing<br>unnecessary.</h1><p>A study in weight, balance<br>and the space between.</p></section><div class="plinth"></div><div class="shadow"></div><div class="object" role="img" aria-label="Abstract charcoal loop sculpture"></div><div class="footer"><span>Loop / An original shape study</span><span>Stone &amp; charcoal</span></div></div>
<script>(()=>{const tl=gsap.timeline({paused:true});tl.from('.plinth,.shadow',{opacity:0,duration:1},0).from('.object',{y:50,rotation:-8,opacity:0,duration:1.2,ease:'power2.out'},.1).from('h1',{clipPath:'inset(0 100% 0 0)',duration:.9,ease:'power2.inOut'},.8).from('.copy p,.wordmark,.footer',{opacity:0,duration:.8,stagger:.12},1.5).to({},{duration:3.46});window.__timelines={main:tl};})();</script></body></html>
