<!doctype html>
<!--
  light-leak-soft: a soft light leak sweeping along one edge (transparent
  texture, screen blend). Two stacked radial glows — a broad warm bloom
  and a tighter hot core — drift along the right edge, swell, and fade.
  Tints derive from the look: --ll-tint is the field pushed toward white
  (warm on warm fields, cool on cool ones), --ll-tint-2 the accent lifted.
  Params (CSS): --ll-tint, --ll-tint-2, --ll-strength (0–1).
  Script: EDGE ("right" | "left" | "top" | "bottom"), IN / HOLD / OUT (s).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="light-leak-soft-root"
      data-composition-id="light-leak-soft"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="light-leak-soft"] {
          --ll-tint: color-mix(in oklab, var(--field, #d9774f) 55%, white);
          --ll-tint-2: color-mix(in oklab, var(--accent, #2f5bff) 30%, white);
          --ll-strength: 0.85;
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        [data-composition-id="light-leak-soft"] .ll-rig {
          position: absolute;
          inset: 0;
          opacity: var(--ll-strength);
          mix-blend-mode: screen;
        }
        [data-composition-id="light-leak-soft"] .ll-fade {
          position: absolute;
          inset: 0;
        }
        [data-composition-id="light-leak-soft"] .ll-glow {
          position: absolute;
          border-radius: 50%;
        }
        [data-composition-id="light-leak-soft"] .ll-bloom {
          width: 1500px;
          height: 1300px;
          left: 1320px;
          top: -260px;
          background: radial-gradient(closest-side, color-mix(in oklab, var(--ll-tint) 85%, transparent), color-mix(in oklab, var(--ll-tint) 30%, transparent) 55%, transparent);
        }
        [data-composition-id="light-leak-soft"] .ll-core {
          width: 620px;
          height: 900px;
          left: 1640px;
          top: 40px;
          background: radial-gradient(closest-side, color-mix(in oklab, white 70%, transparent), color-mix(in oklab, var(--ll-tint) 45%, transparent) 50%, transparent);
        }
        [data-composition-id="light-leak-soft"] .ll-cool {
          width: 1100px;
          height: 700px;
          left: 1480px;
          top: 620px;
          background: radial-gradient(closest-side, color-mix(in oklab, var(--ll-tint-2) 45%, transparent), transparent);
        }
      </style>
      <div class="ll-rig" id="ll-rig">
        <div class="ll-fade" id="ll-fade">
          <div class="ll-glow ll-bloom" id="ll-bloom"></div>
          <div class="ll-glow ll-cool" id="ll-cool"></div>
          <div class="ll-glow ll-core" id="ll-core"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const EDGE = "right";
        const IN = 1.4;
        const HOLD = 1.6;
        const OUT = 1.6;
        const rig = document.getElementById("ll-rig");
        // Fade the inner wrapper so --ll-strength (opacity on the rig) survives.
        const fade = document.getElementById("ll-fade");
        // The rig is authored on the right edge; rotate it for other edges.
        const turn = { right: "none", left: "scaleX(-1)", top: "rotate(-90deg) scale(1.78)", bottom: "rotate(90deg) scale(1.78)" };
        rig.style.transform = turn[EDGE] || "none";
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(fade, { autoAlpha: 0 }, { autoAlpha: 1, duration: IN, ease: "sine.out" }, 0);
        tl.fromTo("#ll-bloom", { y: -180, scale: 0.9 }, { y: 260, scale: 1.08, duration: IN + HOLD + OUT, ease: "sine.inOut" }, 0);
        tl.fromTo("#ll-core", { y: -260, x: 40 }, { y: 320, x: -30, duration: IN + HOLD + OUT, ease: "sine.inOut" }, 0);
        tl.fromTo("#ll-cool", { y: 120, x: 60 }, { y: -140, x: -20, duration: IN + HOLD + OUT, ease: "sine.inOut" }, 0);
        tl.to(fade, { autoAlpha: 0, duration: OUT, ease: "sine.in" }, IN + HOLD);
        window.__timelines = window.__timelines || {};
        window.__timelines["light-leak-soft"] = tl;
      })();
    </script>
  </body>
</html>
