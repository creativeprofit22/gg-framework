<!doctype html>
<!-- Tile flip: finite diagonal cascade. Edit COLS, ROWS and STEP; cut the underlying scene at 1.05s. -->
<html lang="en"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script></head><body>
<div id="tile-flip-root" data-composition-id="tile-flip" data-start="0" data-duration="3" data-width="1920" data-height="1080">
<style>[data-composition-id="tile-flip"]{position:absolute;inset:0;overflow:hidden}[data-composition-id="tile-flip"] .tiles{position:absolute;inset:0;display:grid;perspective:1800px}[data-composition-id="tile-flip"] .tile{background:var(--ink);color:var(--field);backface-visibility:hidden;outline:1px solid var(--ink)}</style><div class="tiles"></div></div>
<script>(()=>{const COLS=8,ROWS=4,STEP=.045;const root=document.querySelector('[data-composition-id="tile-flip"]').querySelector('.tiles');root.style.gridTemplateColumns=`repeat(${COLS},1fr)`;root.style.gridTemplateRows=`repeat(${ROWS},1fr)`;const tl=gsap.timeline({paused:true});for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){const tile=document.createElement('div');tile.className='tile';root.appendChild(tile);gsap.set(tile,{rotationY:90});const delay=(r+c)*STEP;tl.to(tile,{rotationY:0,duration:.55,ease:'power2.out'},delay).to(tile,{rotationY:-90,duration:.55,ease:'power2.in'},1.3+delay);}}tl.to({},{duration:.7},2.3);window.__timelines=window.__timelines||{};window.__timelines["tile-flip"]=tl;})();</script></body></html>
