<!doctype html>
<!--
  film-grain: animated film grain (transparent texture). Fresh noise every
  1/GRAIN_FPS second from a seeded hash of (pixel block, frame index =
  floor(t * GRAIN_FPS)), plus a faint per-frame exposure flicker. Blended
  with overlay so it rides on whatever sits below. Mount on top of a scene
  for its whole length; extend data-duration/DURATION as needed.
  Params (top of script): GRAIN_FPS (24 = film cadence), BLOCK (grain size,
  px), FLICKER (exposure flicker 0–1), SEED, DURATION.
  CSS: --fg-strength (layer opacity), --fg-blend (overlay | soft-light).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="film-grain-root"
      data-composition-id="film-grain"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="film-grain"] {
          --fg-strength: 0.22;
          --fg-blend: overlay;
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        [data-composition-id="film-grain"] canvas {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          opacity: var(--fg-strength);
          mix-blend-mode: var(--fg-blend);
          image-rendering: pixelated;
        }
      </style>
      <canvas id="fgr-canvas" width="960" height="540"></canvas>
    </div>
    <script>
      (function () {
        const GRAIN_FPS = 24;
        const BLOCK = 2;
        const FLICKER = 0.06;
        const SEED = 3;
        const DURATION = 6;
        const canvas = document.getElementById("fgr-canvas");
        canvas.width = Math.ceil(1920 / BLOCK);
        canvas.height = Math.ceil(1080 / BLOCK);
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(canvas.width, canvas.height);
        const N = canvas.width * canvas.height;

        function hash(a, b) {
          let h = Math.imul(a ^ SEED, 374761393) + Math.imul(b, 668265263);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }

        let drawn = -1;
        const state = { t: 0 };
        function draw() {
          const frame = Math.floor(state.t * GRAIN_FPS + 1e-6);
          if (frame === drawn) return;
          drawn = frame;
          const lift = (hash(frame, 9999) - 0.5) * FLICKER * 255;
          const d = img.data;
          for (let i = 0; i < N; i++) {
            // Two taps soften the distribution toward the middle (film-like).
            const v = (hash(i, frame) + hash(i + N, frame)) * 127.5 + lift;
            const o = i * 4;
            d[o] = d[o + 1] = d[o + 2] = v;
            d[o + 3] = 255;
          }
          ctx.putImageData(img, 0, 0);
        }

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(state, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: draw }, 0);
        draw();
        window.__timelines = window.__timelines || {};
        window.__timelines["film-grain"] = tl;
      })();
    </script>
  </body>
</html>
