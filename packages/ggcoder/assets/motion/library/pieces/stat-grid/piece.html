<!doctype html>
<!--
  stat-grid: a row of 3–4 stat cards. Cards rise in with a stagger, each big
  tabular number counts up to its value, a mono label sits above and a tiny
  delta chip pops in once the count lands. The FEATURED card is filled with
  the accent. Transparent background.
  Params (top of script):
    STATS     [{ label, value, decimals, prefix, suffix, delta, up }] — 3 or 4
              (prefix/suffix render at 0.62em; keep numbers ≤ 5 digits)
    PERIOD    short comparison label beside the chips ("vs Q2")
    FEATURED  index of the accent card (-1 for none)
    COUNT     seconds each count-up takes; STAGGER between cards
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="stat-grid-root"
      data-composition-id="stat-grid"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="stat-grid"] {
          position: absolute;
          inset: 0;
          color: var(--ink, #111);
          font-family: var(--text, sans-serif);
        }
        [data-composition-id="stat-grid"] .sg-row {
          position: absolute;
          left: 120px;
          right: 120px;
          top: 50%;
          transform: translateY(-50%);
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: 1fr;
          gap: 28px;
        }
        [data-composition-id="stat-grid"] .sg-card {
          position: relative;
          height: 360px;
          box-sizing: border-box;
          padding: 40px 36px 36px;
          border-radius: var(--radius, 0px);
          background: color-mix(in srgb, var(--field, #fff) 90%, var(--ink, #111));
          box-shadow: inset 0 0 0 2px var(--line, rgba(0, 0, 0, 0.2));
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          overflow: hidden;
        }
        [data-composition-id="stat-grid"] .sg-card.is-featured {
          background: var(--accent, #111);
          box-shadow: none;
          color: var(--field, #fff);
        }
        [data-composition-id="stat-grid"] .sg-label {
          font-family: var(--mono, monospace);
          font-size: 22px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          line-height: 1.35;
          color: var(--muted, rgba(0, 0, 0, 0.6));
        }
        [data-composition-id="stat-grid"] .is-featured .sg-label {
          color: inherit;
          opacity: 0.75;
        }
        [data-composition-id="stat-grid"] .sg-num {
          font-family: var(--display, sans-serif);
          font-weight: var(--display-weight, 800);
          font-stretch: var(--display-stretch, 100%);
          letter-spacing: var(--display-tracking, -0.02em);
          font-size: 96px;
          line-height: 0.9;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        [data-composition-id="stat-grid"] .sg-num .sg-unit {
          font-size: 0.62em;
          margin: 0 0.04em;
        }
        [data-composition-id="stat-grid"] .sg-foot {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 40px;
        }
        [data-composition-id="stat-grid"] .sg-chip {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 7px 14px 6px;
          border-radius: 999px;
          white-space: nowrap;
          flex: none;
          font-family: var(--mono, monospace);
          font-size: 22px;
          font-variant-numeric: tabular-nums;
          background: color-mix(in srgb, var(--accent, #111) 16%, transparent);
          color: var(--accent, #111);
        }
        [data-composition-id="stat-grid"] .sg-chip.is-down {
          background: color-mix(in srgb, var(--ink, #111) 10%, transparent);
          color: var(--muted, rgba(0, 0, 0, 0.6));
        }
        [data-composition-id="stat-grid"] .is-featured .sg-chip {
          background: color-mix(in srgb, var(--field, #fff) 22%, transparent);
          color: var(--field, #fff);
        }
        [data-composition-id="stat-grid"] .sg-chip svg {
          width: 14px;
          height: 14px;
          fill: currentColor;
        }
        [data-composition-id="stat-grid"] .sg-period {
          font-family: var(--mono, monospace);
          font-size: 22px;
          letter-spacing: 0.06em;
          white-space: nowrap;
          text-transform: uppercase;
          color: var(--muted, rgba(0, 0, 0, 0.6));
        }
        [data-composition-id="stat-grid"] .is-featured .sg-period {
          color: inherit;
          opacity: 0.7;
        }
      </style>
      <div class="sg-row" id="sg-row"></div>
    </div>
    <script>
      (function () {
        // edit: stats (3 or 4). delta is text; up=false renders a muted down chip.
        const STATS = [
          { label: "Active users", value: 48.2, decimals: 1, suffix: "K", delta: "12.4%", up: true },
          { label: "Revenue", value: 1.84, decimals: 2, prefix: "$", suffix: "M", delta: "31%", up: true },
          { label: "Uptime", value: 99.98, decimals: 2, suffix: "%", delta: "0.02", up: true },
          { label: "Churn", value: 1.9, decimals: 1, suffix: "%", delta: "0.6", up: false },
        ];
        const FEATURED = 1;
        const PERIOD = "vs Q2"; // edit: comparison period shown beside chips (keep it short)
        const COUNT = 1.4;
        const STAGGER = 0.14;

        const row = document.getElementById("sg-row");
        const UP = '<svg viewBox="0 0 14 14"><path d="M7 2 13 11H1z"/></svg>';
        const DOWN = '<svg viewBox="0 0 14 14"><path d="M7 12 1 3h12z"/></svg>';
        const cards = STATS.map((s, i) => {
          const card = document.createElement("div");
          card.className = "sg-card" + (i === FEATURED ? " is-featured" : "");
          card.innerHTML =
            '<div class="sg-label"></div><div class="sg-num"></div>' +
            `<div class="sg-foot"><span class="sg-chip${s.up ? "" : " is-down"}">${s.up ? UP : DOWN}<span></span></span><span class="sg-period"></span></div>`;
          card.querySelector(".sg-label").textContent = s.label;
          card.querySelector(".sg-chip span").textContent = s.delta;
          card.querySelector(".sg-period").textContent = PERIOD;
          row.appendChild(card);
          return {
            card,
            num: card.querySelector(".sg-num"),
            chip: card.querySelector(".sg-chip"),
            period: card.querySelector(".sg-period"),
            s,
            v: { x: 0 },
          };
        });

        const fmt = (s, x) => {
          const n = x.toLocaleString("en-US", {
            minimumFractionDigits: s.decimals || 0,
            maximumFractionDigits: s.decimals || 0,
          });
          const unit = (u) => (u ? `<span class="sg-unit">${u}</span>` : "");
          return unit(s.prefix) + n + unit(s.suffix);
        };

        const tl = gsap.timeline({ paused: true });
        cards.forEach((c, i) => {
          const at = 0.2 + i * STAGGER;
          const paint = () => (c.num.innerHTML = fmt(c.s, c.v.x));
          tl.fromTo(c.card, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, at);
          tl.fromTo(c.v, { x: 0 }, { x: c.s.value, duration: COUNT, ease: "power3.out", onUpdate: paint }, at + 0.1);
          tl.fromTo(c.chip, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + COUNT * 0.75);
          tl.fromTo(c.period, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, at + COUNT * 0.8);
          paint();
        });
        tl.to({}, { duration: Math.max(0.1, 4 - tl.duration()) });
        window.__timelines = window.__timelines || {};
        window.__timelines["stat-grid"] = tl;
      })();
    </script>
  </body>
</html>
