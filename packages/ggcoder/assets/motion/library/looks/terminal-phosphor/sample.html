<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/looks/terminal-phosphor.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--field);
        overflow: hidden;
        font-family: var(--mono);
        color: var(--ink);
        text-shadow: 0 0 6px rgba(141, 255, 154, 0.55), 0 0 22px rgba(141, 255, 154, 0.22);
      }
      /* Screen glow in the middle, curved-glass falloff at the corners. */
      .glass {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1300px 900px at 50% 48%, rgba(141, 255, 154, 0.07), transparent 70%);
      }
      /* Scanlines and curved-glass vignette sit over everything as one pseudo-layer. */
      #root::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        background:
          radial-gradient(ellipse 1150px 760px at 50% 50%, transparent 62%, rgba(0, 0, 0, 0.85) 100%),
          repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.34) 2px 4px);
      }
      .term {
        position: absolute;
        left: 140px;
        top: 128px;
        font-size: 30px;
        line-height: 54px;
        font-weight: 400;
      }
      .ln {
        display: block;
        white-space: pre;
        overflow: hidden;
        width: 0ch;
      }
      .ln.out {
        color: var(--muted);
      }
      .ln .ok {
        color: var(--ink);
      }
      .cursor {
        display: inline-block;
        width: 0.62em;
        height: 1em;
        background: var(--ink);
        vertical-align: -0.12em;
        box-shadow: 0 0 10px rgba(141, 255, 154, 0.6);
      }
      .label {
        position: absolute;
        left: 124px;
        top: 496px;
        font-size: 26px;
        color: var(--muted);
      }
      .readout {
        position: absolute;
        left: 120px;
        top: 590px;
        font-family: var(--display);
        font-weight: var(--display-weight);
        letter-spacing: var(--display-tracking);
        font-variation-settings: "ROND" 100;
        font-size: 360px;
        line-height: 1;
        text-shadow: 0 0 12px rgba(141, 255, 154, 0.7), 0 0 60px rgba(141, 255, 154, 0.35);
      }
      .readout small {
        font-size: 220px;
        color: var(--muted);
      }
      .side {
        position: absolute;
        left: 1180px;
        top: 700px;
        width: 620px;
        font-size: 28px;
        line-height: 50px;
      }
      .side .alert {
        color: var(--accent);
        text-shadow: 0 0 8px rgba(255, 179, 56, 0.6), 0 0 26px rgba(255, 179, 56, 0.25);
      }
      .bar {
        margin-top: 10px;
        color: var(--muted);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="look-terminal-phosphor"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div class="glass"></div>
      <!-- edit: command and log lines (keep data-n = character count) -->
      <div class="term">
        <span class="ln" data-n="31">~/relay $ gg deploy --prod</span>
        <span class="ln out" data-n="34"><span class="ok">✓</span> resolved 214 packages      12ms</span>
        <span class="ln out" data-n="34"><span class="ok">✓</span> compiled 1,208 modules    410ms</span>
        <span class="ln out" data-n="34"><span class="ok">✓</span> pushed to 38 edge regions 302ms</span>
        <span class="ln out" data-n="34"><span class="ok">✓</span> live at relay.dev         116ms</span>
      </div>
      <div class="label" id="label">total deploy time</div>
      <div class="readout" id="readout"><span id="t">840</span><small>ms</small></div>
      <div class="side" id="side">
        <div class="alert">▲ 3.1× faster than v1</div>
        <div>p99 cold start 142ms</div>
        <div class="bar" id="bar">████████████████████ 100%</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const lines = gsap.utils.toArray(".ln");
      const cursor = document.createElement("span");
      cursor.className = "cursor";

      // Prompt types out; each log line then prints in one fast sweep.
      tl.fromTo(lines[0], { width: "0ch" }, { width: "31ch", duration: 0.75, ease: "steps(26)" }, 0.15);
      lines.slice(1).forEach((l, i) => {
        tl.fromTo(l, { width: "0ch" }, { width: "34ch", duration: 0.16, ease: "steps(34)" }, 1.0 + i * 0.22);
      });
      const t = { v: 0 };
      const tEl = document.getElementById("t");
      tl.fromTo(
        t,
        { v: 0 },
        { v: 840, duration: 1.0, ease: "steps(21)", onUpdate: () => (tEl.textContent = String(Math.round(t.v)).padStart(3, "0")) },
        1.0,
      );
      tl.from("#label, #readout", { opacity: 0, duration: 0.05 }, 1.0)
        .fromTo("#readout", { opacity: 0.2 }, { opacity: 1, duration: 0.06, repeat: 4, yoyo: true, ease: "none" }, 2.0)
        .from("#side > div", { opacity: 0, duration: 0.05, stagger: 0.18 }, 2.2);
      const bar = document.getElementById("bar");
      const b = { v: 0 };
      tl.fromTo(
        b,
        { v: 0 },
        {
          v: 20,
          duration: 0.8,
          ease: "steps(20)",
          onUpdate: () => {
            const n = Math.round(b.v);
            bar.textContent = "█".repeat(n) + "░".repeat(20 - n) + " " + String(n * 5).padStart(3, " ") + "%";
          },
        },
        2.55,
      );
      tl.to({}, { duration: 0.1 }, 3.9);
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
