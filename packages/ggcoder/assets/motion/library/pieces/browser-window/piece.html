<!doctype html>
<!--
  browser-window: a clean browser window (window dots, back/forward, URL
  pill) springs in with a slight scale + tilt and settles; then its default
  skeleton dashboard builds in. Transparent background.
  The content area (.bw-content) is a slot: drop a real screenshot in as an
  <img> (see the comment inside it) and delete the skeleton.
  Params: --bw-w / --bw-h (window size), --bw-x / --bw-y (center),
  ENTER_AT (s), TILT (deg the window starts rotated).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="browser-window-root"
      data-composition-id="browser-window"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="browser-window"] {
          --bw-w: 1480px;
          --bw-h: 860px;
          --bw-x: 960px;
          --bw-y: 548px;
          --bw-r: max(var(--radius, 18px), 14px);
          position: absolute;
          inset: 0;
          color: var(--ink, #111);
          font-family: var(--text, sans-serif);
          perspective: 2400px;
        }
        [data-composition-id="browser-window"] .bw-win {
          position: absolute;
          left: calc(var(--bw-x) - var(--bw-w) / 2);
          top: calc(var(--bw-y) - var(--bw-h) / 2);
          width: var(--bw-w);
          height: var(--bw-h);
          border-radius: var(--bw-r);
          background: #fff;
          overflow: hidden;
          box-shadow:
            0 0 0 1px color-mix(in srgb, var(--ink, #111) 8%, transparent),
            0 1px 2px rgba(0, 0, 0, 0.06),
            0 12px 32px rgba(0, 0, 0, 0.1),
            0 40px 90px -20px color-mix(in srgb, var(--ink, #111) 28%, transparent);
          transform-origin: 50% 70%;
          display: flex;
          flex-direction: column;
        }
        [data-composition-id="browser-window"] .bw-bar {
          height: 84px;
          flex: none;
          display: flex;
          align-items: center;
          gap: 28px;
          padding: 0 30px;
          background: color-mix(in srgb, var(--field, #f3f4f6) 55%, #fff);
          border-bottom: 1.5px solid color-mix(in srgb, var(--ink, #111) 8%, transparent);
        }
        [data-composition-id="browser-window"] .bw-dots {
          display: flex;
          gap: 12px;
        }
        [data-composition-id="browser-window"] .bw-dots i {
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: color-mix(in srgb, var(--ink, #111) 16%, #fff);
        }
        [data-composition-id="browser-window"] .bw-nav {
          display: flex;
          gap: 14px;
          color: var(--muted, #888);
        }
        [data-composition-id="browser-window"] .bw-url {
          flex: 1;
          max-width: 720px;
          margin: 0 auto;
          height: 50px;
          border-radius: 25px;
          background: #fff;
          box-shadow:
            0 0 0 1.5px color-mix(in srgb, var(--ink, #111) 8%, transparent),
            0 1px 2px rgba(0, 0, 0, 0.05);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font-size: 26px;
          color: var(--ink, #111);
          letter-spacing: -0.005em;
        }
        [data-composition-id="browser-window"] .bw-url svg {
          color: var(--muted, #888);
        }
        [data-composition-id="browser-window"] .bw-url .bw-dim {
          color: var(--muted, #888);
        }
        [data-composition-id="browser-window"] .bw-spacer {
          width: 150px;
        }
        [data-composition-id="browser-window"] .bw-content {
          position: relative;
          flex: 1;
          display: flex;
          overflow: hidden;
        }
        [data-composition-id="browser-window"] .bw-content img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
        }
        /* default skeleton */
        [data-composition-id="browser-window"] .bw-side {
          width: 330px;
          flex: none;
          padding: 40px 28px;
          border-right: 1.5px solid color-mix(in srgb, var(--ink, #111) 7%, transparent);
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        [data-composition-id="browser-window"] .bw-brand {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 30px;
          font-weight: 600;
          margin: 0 0 26px 12px;
        }
        [data-composition-id="browser-window"] .bw-logo {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: var(--accent, #2f5bff);
        }
        [data-composition-id="browser-window"] .bw-item {
          display: flex;
          align-items: center;
          gap: 18px;
          height: 62px;
          padding: 0 16px;
          border-radius: 14px;
          font-size: 27px;
          color: var(--muted, #888);
        }
        [data-composition-id="browser-window"] .bw-item.on {
          background: color-mix(in srgb, var(--accent, #2f5bff) 10%, #fff);
          color: var(--accent, #2f5bff);
          font-weight: 600;
        }
        [data-composition-id="browser-window"] .bw-item b {
          width: 26px;
          height: 26px;
          border-radius: 8px;
          border: 3px solid currentColor;
          opacity: 0.8;
        }
        [data-composition-id="browser-window"] .bw-main {
          flex: 1;
          padding: 44px 52px;
          display: flex;
          flex-direction: column;
          gap: 34px;
        }
        [data-composition-id="browser-window"] .bw-h {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        [data-composition-id="browser-window"] .bw-title {
          font-family: var(--display, sans-serif);
          font-weight: var(--display-weight, 600);
          letter-spacing: var(--display-tracking, -0.02em);
          font-size: 44px;
        }
        [data-composition-id="browser-window"] .bw-btn {
          height: 58px;
          padding: 0 28px;
          border-radius: 14px;
          background: var(--accent, #2f5bff);
          color: #fff;
          font-size: 26px;
          font-weight: 600;
          display: flex;
          align-items: center;
          box-shadow: 0 6px 16px color-mix(in srgb, var(--accent, #2f5bff) 30%, transparent);
        }
        [data-composition-id="browser-window"] .bw-cards {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 26px;
        }
        [data-composition-id="browser-window"] .bw-card {
          border-radius: 18px;
          padding: 26px 28px;
          background: #fff;
          box-shadow:
            0 0 0 1.5px color-mix(in srgb, var(--ink, #111) 7%, transparent),
            0 1px 2px rgba(0, 0, 0, 0.04),
            0 8px 20px rgba(0, 0, 0, 0.04);
        }
        [data-composition-id="browser-window"] .bw-card small {
          display: block;
          font-size: 24px;
          color: var(--muted, #888);
        }
        [data-composition-id="browser-window"] .bw-card strong {
          display: block;
          margin-top: 10px;
          font-size: 42px;
          font-weight: 600;
          letter-spacing: -0.02em;
        }
        [data-composition-id="browser-window"] .bw-chart {
          flex: 1;
          border-radius: 18px;
          padding: 28px;
          box-shadow:
            0 0 0 1.5px color-mix(in srgb, var(--ink, #111) 7%, transparent),
            0 1px 2px rgba(0, 0, 0, 0.04);
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        [data-composition-id="browser-window"] .bw-skel {
          height: 18px;
          border-radius: 9px;
          background: color-mix(in srgb, var(--ink, #111) 8%, #fff);
        }
        [data-composition-id="browser-window"] .bw-bars {
          flex: 1;
          display: flex;
          align-items: flex-end;
          gap: 18px;
          padding-top: 10px;
        }
        [data-composition-id="browser-window"] .bw-bars i {
          flex: 1;
          border-radius: 10px 10px 4px 4px;
          background: color-mix(in srgb, var(--accent, #2f5bff) 22%, #fff);
          transform-origin: 50% 100%;
        }
        [data-composition-id="browser-window"] .bw-bars i.hi {
          background: var(--accent, #2f5bff);
        }
      </style>
      <div class="bw-win" id="bw-win">
        <div class="bw-bar">
          <div class="bw-dots"><i></i><i></i><i></i></div>
          <div class="bw-nav">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M9 5l7 7-7 7" /></svg>
          </div>
          <div class="bw-url">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
            <!-- edit: URL (domain + dim path) -->
            <span>acme.app<span class="bw-dim">/dashboard</span></span>
          </div>
          <div class="bw-spacer"></div>
        </div>
        <div class="bw-content">
          <!-- slot: replace the skeleton below with a real screenshot, e.g.
               <img src="assets/screenshot.png" alt="" /> -->
          <div class="bw-side">
            <!-- edit: product name -->
            <div class="bw-brand bw-in"><span class="bw-logo"></span>Acme</div>
            <!-- edit: nav labels -->
            <div class="bw-item on bw-in"><b></b>Overview</div>
            <div class="bw-item bw-in"><b></b>Customers</div>
            <div class="bw-item bw-in"><b></b>Reports</div>
            <div class="bw-item bw-in"><b></b>Settings</div>
          </div>
          <div class="bw-main">
            <div class="bw-h bw-in">
              <!-- edit: page title + button -->
              <div class="bw-title">Overview</div>
              <div class="bw-btn">New report</div>
            </div>
            <div class="bw-cards">
              <!-- edit: stat cards -->
              <div class="bw-card bw-in"><small>Revenue</small><strong>$48.2k</strong></div>
              <div class="bw-card bw-in"><small>Active users</small><strong>12,480</strong></div>
              <div class="bw-card bw-in"><small>Conversion</small><strong>4.7%</strong></div>
            </div>
            <div class="bw-chart bw-in">
              <div class="bw-skel" style="width: 26%"></div>
              <div class="bw-skel" style="width: 14%; opacity: 0.6"></div>
              <div class="bw-bars" id="bw-bars">
                <i style="height: 38%"></i><i style="height: 52%"></i><i style="height: 44%"></i>
                <i style="height: 63%"></i><i style="height: 58%"></i><i style="height: 72%"></i>
                <i style="height: 66%"></i><i style="height: 81%"></i><i style="height: 76%"></i>
                <i class="hi" style="height: 96%"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const ENTER_AT = 0.1;
        const TILT = -4;
        const root = document.querySelector('[data-composition-id="browser-window"]');
        const q = (s) => root.querySelectorAll(s);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#bw-win",
          { opacity: 0, y: 140, scale: 0.86, rotation: TILT, rotationX: 14 },
          { opacity: 1, duration: 0.35, ease: "power1.out" },
          ENTER_AT,
        );
        tl.to("#bw-win", { y: 0, scale: 1, rotation: 0, rotationX: 0, duration: 1.3, ease: "elastic.out(1, 0.75)" }, ENTER_AT);
        tl.fromTo(q(".bw-in"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.06 }, ENTER_AT + 0.45);
        tl.fromTo(q(".bw-bars i"), { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out", stagger: 0.04 }, ENTER_AT + 0.9);
        tl.to({}, { duration: 4 - tl.duration() });
        window.__timelines = window.__timelines || {};
        window.__timelines["browser-window"] = tl;
      })();
    </script>
  </body>
</html>
