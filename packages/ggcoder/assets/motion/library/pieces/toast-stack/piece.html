<!doctype html>
<!--
  toast-stack: three notifications drop in from the top one after another,
  iOS-style: each new one lands in front and the earlier ones slide back
  into a stack (smaller, dimmer, peeking out below). Transparent background.
  Params: --ts-w (toast width), --ts-x / --ts-y (center x, top y of the
  front toast), ARRIVALS (seconds each toast starts dropping, in markup order),
  PEEK (px each older toast peeks out), SHRINK (scale lost per depth).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="toast-stack-root"
      data-composition-id="toast-stack"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="toast-stack"] {
          --ts-w: 1000px;
          --ts-x: 960px;
          --ts-y: 420px;
          --ts-r: max(calc(var(--radius, 18px) * 1.6), 26px);
          position: absolute;
          inset: 0;
          color: var(--ink, #111);
          font-family: var(--text, sans-serif);
        }
        [data-composition-id="toast-stack"] .ts-toast {
          position: absolute;
          left: calc(var(--ts-x) - var(--ts-w) / 2);
          top: var(--ts-y);
          width: var(--ts-w);
          box-sizing: border-box;
          display: flex;
          align-items: center;
          gap: 28px;
          padding: 30px 36px;
          border-radius: var(--ts-r);
          background: rgba(255, 255, 255, 0.97);
          backdrop-filter: blur(24px) saturate(1.4);
          transform-origin: 50% 0%;
          box-shadow:
            0 0 0 1px color-mix(in srgb, var(--ink, #111) 6%, transparent),
            0 1px 2px rgba(0, 0, 0, 0.06),
            0 12px 32px rgba(0, 0, 0, 0.1),
            0 30px 60px -20px color-mix(in srgb, var(--ink, #111) 22%, transparent);
        }
        [data-composition-id="toast-stack"] .ts-icon {
          flex: none;
          width: 88px;
          height: 88px;
          border-radius: 22px;
          display: grid;
          place-items: center;
          color: #fff;
          background: var(--accent, #2f5bff);
          box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.08), 0 4px 10px color-mix(in srgb, var(--accent, #2f5bff) 30%, transparent);
        }
        [data-composition-id="toast-stack"] .ts-icon.ink {
          background: var(--ink, #111);
          box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15), 0 4px 10px rgba(0, 0, 0, 0.12);
        }
        [data-composition-id="toast-stack"] .ts-icon.soft {
          background: color-mix(in srgb, var(--accent, #2f5bff) 14%, #fff);
          color: var(--accent, #2f5bff);
          box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent, #2f5bff) 18%, transparent);
        }
        [data-composition-id="toast-stack"] .ts-text {
          flex: 1;
          min-width: 0;
        }
        [data-composition-id="toast-stack"] .ts-top {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          font-size: 24px;
          color: var(--muted, #888);
          letter-spacing: 0.02em;
        }
        [data-composition-id="toast-stack"] .ts-app {
          text-transform: uppercase;
          font-weight: 600;
          letter-spacing: 0.08em;
        }
        [data-composition-id="toast-stack"] .ts-title {
          margin-top: 6px;
          font-size: 34px;
          font-weight: 650;
          letter-spacing: -0.01em;
        }
        [data-composition-id="toast-stack"] .ts-body {
          margin-top: 4px;
          font-size: 29px;
          color: var(--muted, #888);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      </style>
      <!-- edit: toasts in arrival order (icon class: "" accent, "ink", "soft") -->
      <div class="ts-toast">
        <div class="ts-icon ink">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        </div>
        <div class="ts-text">
          <div class="ts-top"><span class="ts-app">Deploys</span><span>now</span></div>
          <div class="ts-title">Build passed</div>
          <div class="ts-body">main · 42 checks green in 1m 12s</div>
        </div>
      </div>
      <div class="ts-toast">
        <div class="ts-icon soft">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M19 8v6M22 11h-6" /></svg>
        </div>
        <div class="ts-text">
          <div class="ts-top"><span class="ts-app">Team</span><span>now</span></div>
          <div class="ts-title">Maya joined your workspace</div>
          <div class="ts-body">Say hi and assign her first task</div>
        </div>
      </div>
      <div class="ts-toast">
        <div class="ts-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3" /><path d="M2 10h20M6 15h4" /></svg>
        </div>
        <div class="ts-text">
          <div class="ts-top"><span class="ts-app">Payments</span><span>now</span></div>
          <div class="ts-title">Payment received · $2,400</div>
          <div class="ts-body">Northwind renewed the Pro plan for a year</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const ARRIVALS = [0.3, 1.5, 2.7];
        const PEEK = 34;
        const SHRINK = 0.055;
        const DROP = 420;
        const root = document.querySelector('[data-composition-id="toast-stack"]');
        const toasts = [...root.querySelectorAll(".ts-toast")];
        const tl = gsap.timeline({ paused: true });
        const spring = "back.out(1.25)";

        toasts.forEach((toast, i) => {
          toast.style.zIndex = String(10 + i);
          const land = ARRIVALS[i] ?? i * 1.2;
          tl.fromTo(
            toast,
            { y: -DROP, scale: 1 },
            { y: 0, duration: 0.75, ease: spring },
            land,
          );
          tl.fromTo(toast, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, land);
          tl.fromTo(toast, { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, land);
          // Everything already on screen steps back one level of depth.
          for (let j = 0; j < i; j++) {
            const depth = i - j;
            tl.to(
              toasts[j],
              {
                y: depth * PEEK,
                scale: 1 - depth * SHRINK,
                opacity: depth > 2 ? 0 : 1 - depth * 0.28,
                duration: 0.6,
                ease: "power3.out",
              },
              land + 0.08,
            );
            // the content of back cards fades so only the edge reads
            tl.to(toasts[j].children, { opacity: 0, duration: 0.2, ease: "power1.out" }, land - 0.1);
          }
        });
        tl.to({}, { duration: 5 - tl.duration() });
        window.__timelines = window.__timelines || {};
        window.__timelines["toast-stack"] = tl;
      })();
    </script>
  </body>
</html>
