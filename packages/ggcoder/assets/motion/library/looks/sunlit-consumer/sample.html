<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="assets/fonts/fonts.css"><link rel="stylesheet" href="assets/looks/sunlit-consumer.css"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--field);color:var(--ink);font-family:var(--text)}
.light{position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,color-mix(in srgb,var(--accent) 9%,transparent) 70%,transparent 90%)}
.copy{position:absolute;left:128px;top:230px;width:820px}.brand{font-size:30px;line-height:1.4;margin:0 0 64px;color:var(--accent)}h1{font:500 142px/1.02 var(--display);letter-spacing:var(--display-tracking);margin:0 0 40px}.dek{font-size:32px;line-height:1.5;max-width:620px;color:var(--muted)}
.planner{position:absolute;left:1100px;top:180px;width:600px;height:720px;box-sizing:border-box;padding:54px;background:var(--field);color:var(--ink);border:2px solid var(--line);border-radius:8px;box-shadow:48px 64px 80px color-mix(in srgb,var(--ink) 20%,transparent);transform:rotate(7deg)}
.day{font:22px/1.4 var(--mono);color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:24px}.date{font:500 150px/1.1 var(--display);margin:30px 0 32px;letter-spacing:-.06em}.task{font-size:28px;line-height:1.4;padding:22px 0;border-bottom:2px solid var(--line);display:flex;gap:20px}.check{width:26px;height:26px;border:2px solid var(--accent);border-radius:50%;flex-shrink:0;margin-top:4px}.done .check{background:var(--accent);color:var(--field)}.note{font:italic 30px/1.3 var(--display);margin-top:38px;color:var(--accent)}
</style></head><body><div id="root" class="look-sunlit-consumer" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080"><div class="light"></div>
<!-- edit: illustrative brand and message --><section class="copy"><p class="brand">Daylight / A little more space</p><h1>A day that<br>feels yours.</h1><p class="dek">Make time for the small things.<br>Leave room for everything else.</p></section>
<!-- edit: illustrative planner date and tasks --><div class="planner"><div class="day">MONDAY / SEPTEMBER</div><div class="date">28</div><div class="task done"><span class="check"></span>A slower morning</div><div class="task"><span class="check"></span>One good idea</div><div class="task"><span class="check"></span>A walk before sunset</div><div class="note">Enough for today.</div></div></div>
<script>(()=>{const tl=gsap.timeline({paused:true});tl.from('.planner',{y:90,rotation:12,opacity:0,duration:1,ease:'power3.out'},0).from('.brand,h1,.dek',{y:28,opacity:0,stagger:.16,duration:.7,ease:'power2.out'},.2).from('.task,.note',{opacity:0,stagger:.12,duration:.45},.8).from('.light',{opacity:0,duration:2},0).to({},{duration:3});window.__timelines={main:tl};})();</script></body></html>
