<!doctype html>
<!--
  slam-word: one huge display word rises out of a mask and widens as it
  lands (variable width axis), then holds. Transparent background.
  Best with a width-axis display face (Archivo, Anybody, Mona Sans).
  Params: --sw-size (font size), --sw-x / --sw-y (position),
  WIDTH_FROM / WIDTH_TO (font-stretch % at start/end).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="slam-word-root"
      data-composition-id="slam-word"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <style>
        [data-composition-id="slam-word"] {
          --sw-size: 260px;
          --sw-x: 84px;
          --sw-y: 540px;
          position: absolute;
          inset: 0;
          color: var(--ink, #111);
        }
        [data-composition-id="slam-word"] .sw-mask {
          position: absolute;
          left: var(--sw-x);
          top: var(--sw-y);
          transform: translateY(-50%);
          overflow: hidden;
          line-height: 0.86;
          padding: 0.04em 0;
        }
        [data-composition-id="slam-word"] .sw-word {
          display: inline-block;
          font-family: var(--display, sans-serif);
          font-weight: var(--display-weight, 800);
          font-size: var(--sw-size);
          letter-spacing: var(--display-tracking, -0.03em);
          text-transform: uppercase;
          white-space: nowrap;
        }
      </style>
      <!-- edit: the word -->
      <div class="sw-mask"><span class="sw-word" id="sw-word">Timing</span></div>
    </div>
    <script>
      (function () {
        const WIDTH_FROM = 62;
        const WIDTH_TO = 88;
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#sw-word", { yPercent: 108 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0.15);
        tl.fromTo(
          "#sw-word",
          { fontStretch: `${WIDTH_FROM}%` },
          { fontStretch: `${WIDTH_TO}%`, duration: 1.2, ease: "expo.out" },
          0.15,
        );
        tl.to({}, { duration: 1.65 });
        window.__timelines = window.__timelines || {};
        window.__timelines["slam-word"] = tl;
      })();
    </script>
  </body>
</html>
